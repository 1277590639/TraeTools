name: macOS Port Probe

# 探路构建：验证主程序能否在 macOS 上编译，把真实错误清单收集回来。
# 只在 macos-avalonia 分支上由 push 触发，不发 Release，不影响 main 的构建与用户。
#
# 不用 workflow_dispatch：GitHub 只注册默认分支上存在的 workflow，
# 未进 main 的文件调 dispatch API 会 404。push 触发没有这个限制。

on:
  push:
    branches:
      - macos-avalonia
    paths:
      - "TraeTools.csproj"
      - "**/*.cs"
      - "**/*.axaml"
      - ".github/workflows/macos-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: osx-x64 编译探路
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Toolchain info
        run: |
          sw_vers
          uname -m
          dotnet --info

      # 先只放开平台差异：单文件 / 裁剪 / AOT 都会把真正的跨平台编译错误淹掉。
      - name: Publish osx-x64
        continue-on-error: true
        run: >
          dotnet publish TraeTools.csproj
          -c Release
          -r osx-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:EnableAot=false
          -o out-macos
          2>&1 | tee /tmp/publish-osx-x64.log

      # 权威判据：产物二进制必须真的存在。publish 步骤接了 tee，退出码不可信。
      - name: Gate — binary must exist
        run: |
          if [ -f out-macos/TraeTools ]; then
            echo "OK: 产物已生成"
            file out-macos/TraeTools
            du -sh out-macos
          else
            echo "FAIL: 没有生成 out-macos/TraeTools，编译未通过"
            exit 1
          fi

      - name: Collect error summary
        if: always()
        run: |
          grep -E "error [A-Z]+[0-9]+" /tmp/publish-osx-x64.log \
            | sed -E 's/.*(error [A-Z]+[0-9]+):/\1:/' \
            | sort | uniq -c | sort -rn > /tmp/errors-summary.txt || true
          echo "--- 去重后的错误种类 ---"
          cat /tmp/errors-summary.txt
          echo "--- 错误总数 ---"
          grep -cE "error [A-Z]+[0-9]+" /tmp/publish-osx-x64.log || echo 0

      # 编译通过不等于界面能出来。这里真的把 App 跑起来、截图、数窗口，
      # 把图作为 artifact 传回来 —— 这是不装 SDK 也能拿到「mac 上长什么样」的唯一实证。
      - name: Smoke — 启动并截图
        if: success()
        run: |
          mkdir -p /tmp/smoke
          ./out-macos/TraeTools > /tmp/smoke/app.log 2>&1 &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "FAIL: 进程已退出，未存活到 15s"
            echo "--- app.log ---"
            cat /tmp/smoke/app.log
            exit 1
          fi
          echo "ALIVE pid=$APP_PID"
          ps -o pid,stat,%cpu,rss -p "$APP_PID" || true
          screencapture -x /tmp/smoke/screen-15s.png
          # 数窗口需要辅助功能权限，拿不到就当未知，不能因此判死。
          osascript -e "tell application \"System Events\" to get count of windows of (first process whose unix id is $APP_PID)" \
            > /tmp/smoke/window-count.txt 2>/tmp/smoke/osascript.err \
            && echo "窗口数: $(cat /tmp/smoke/window-count.txt)" \
            || { echo "窗口数: 未知（osascript 无权限或失败）"; cat /tmp/smoke/osascript.err; }
          echo "--- app.log 尾部 ---"
          tail -40 /tmp/smoke/app.log
          kill "$APP_PID" 2>/dev/null || true

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-smoke
          path: /tmp/smoke/
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-osx-x64-logs
          path: |
            /tmp/publish-osx-x64.log
            /tmp/errors-summary.txt
