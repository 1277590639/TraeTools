name: macOS Port Probe

# 探路/验证构建：编译 macOS 版、组装 .app、跑统一验收脚本、真机启动截图。
# 只在 macos-avalonia 分支上由 push 触发，不发 Release，不影响 main 的构建与用户。
#
# 不用 workflow_dispatch：GitHub 只注册默认分支上存在的 workflow，
# 未进 main 的文件调 dispatch API 会 404。push 触发没有这个限制。

on:
  push:
    branches:
      - macos-avalonia
    paths:
      - "TraeTools.csproj"
      - "**/*.cs"
      - "**/*.axaml"
      - "macos-loginhost/**"
      - ".github/pkg_dotnet_dmg.sh"
      - ".github/verify_macos_artifacts.sh"
      - ".github/workflows/macos-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: osx-x64 构建与验收
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Toolchain info
        run: |
          sw_vers
          uname -m
          dotnet --info

      # 先只放开平台差异：单文件 / 裁剪 / AOT 都会把真正的跨平台编译错误淹掉。
      - name: Publish osx-x64
        run: >
          dotnet publish TraeTools.csproj
          -c Release
          -r osx-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:EnableAot=false
          -o out-macos
          2>&1 | tee /tmp/publish-osx-x64.log

      # 权威判据：产物二进制必须真的存在且可执行。publish 接了 tee，退出码不可信。
      - name: Gate — 主程序二进制
        run: |
          if [ -f out-macos/TraeTools ]; then
            file out-macos/TraeTools
            du -sh out-macos
          else
            echo "FAIL: 没有生成 out-macos/TraeTools，编译未通过"
            exit 1
          fi

      - name: Collect error summary
        if: always()
        run: |
          grep -E "error [A-Z]+[0-9]+" /tmp/publish-osx-x64.log \
            | sed -E 's/.*(error [A-Z]+[0-9]+):/\1:/' \
            | sort | uniq -c | sort -rn > /tmp/errors-summary.txt || true
          echo "--- 错误总数 ---"
          grep -cE "error [A-Z]+[0-9]+" /tmp/publish-osx-x64.log || echo 0

      - name: Build login host (Swift)
        run: bash .github/build_login_host.sh x86_64 out-macos

      - name: Package .app + dmg
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('version.json'))['version'])")"
          bash .github/pkg_dotnet_dmg.sh x86_64 "$VERSION" out-macos

      - name: Verify — 统一验收脚本
        run: bash .github/verify_macos_artifacts.sh ./TraeTools.app/Contents/MacOS

      # 用 open 启动而不是裸 exec：裸执行绕过 LaunchServices，拿不到 bundle 身份，
      # 用户双击时不会这样，只有走 open 才是真实分发形态。
      - name: Smoke — 从 .app 启动并截图
        run: bash .github/smoke_macos_app.sh ./TraeTools.app /tmp/smoke

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-smoke
          path: /tmp/smoke/
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-osx-x64-logs
          path: |
            /tmp/publish-osx-x64.log
            /tmp/errors-summary.txt
